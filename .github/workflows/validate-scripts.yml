name: Validate shell scripts

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bash syntax
        run: |
          set -e
          for f in MacOS/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
      - name: Run shellcheck (optional)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          for f in MacOS/*.sh; do
            echo "ShellCheck $f"
            shellcheck "$f" || true
          done
